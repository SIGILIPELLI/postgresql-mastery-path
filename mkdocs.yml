site_name: PostgreSQL Mastery Path
site_description: A hands-on PostgreSQL course that goes beyond basic SQL — psql, data types, roles, MVCC, VACUUM, index types, EXPLAIN, locking, WAL, JSONB, full-text search, PL/pgSQL, partitioning, row-level security, replication, point-in-time recovery, monitoring and tuning.
site_url: https://sigilipelli.github.io/postgresql-mastery-path/
repo_url: https://github.com/sigilipelli/postgresql-mastery-path
repo_name: postgresql-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · PostgreSQL Foundations":
      - Overview: level-1/index.md
      - "01 · How PostgreSQL Is Built: Clusters, Processes & Setup": level-1/01-architecture-and-setup.md
      - "02 · psql Like a Pro": level-1/02-psql-like-a-pro.md
      - "03 · PostgreSQL Data Types That Matter": level-1/03-data-types.md
      - "04 · Schemas, search_path & Organizing Objects": level-1/04-schemas-search-path.md
      - "05 · Roles, Privileges & Client Authentication": level-1/05-roles-privileges.md
      - "06 · Constraints Beyond the Basics": level-1/06-constraints.md
      - "07 · Transactions & Isolation Levels in Practice": level-1/07-transactions-isolation.md
      - "08 · PostgreSQL-Flavoured SQL: RETURNING, Upserts, MERGE & More": level-1/08-postgres-sql-features.md
      - "09 · Backups with pg_dump & pg_restore": level-1/09-pg-dump-restore.md
      - "10 · Project — Event Ticketing Database": level-1/10-project-event-ticketing.md
  - "Level 2 · Internals: MVCC, Storage & Indexes":
